<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FarmingTools.in">
  <!-- The photographic logo turns to mud below ~64px: at 32px the tiller, the soil and the
       triangle collapse into one dark smudge. This is that mark reduced to what survives the
       size — the rounded triangle and the green machine body. Reds and greens are sampled
       from the logo artwork itself, not guessed. -->
  <defs>
    <linearGradient id="ftRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d41010"/>
      <stop offset="0.55" stop-color="#a80000"/>
      <stop offset="1" stop-color="#6d0000"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-90 32 32)">
    <path fill="url(#ftRed)"
          d="M20.5 4h23c3.2 0 6.2 1.7 7.8 4.4l11.5 19.9c1.6 2.7 1.6 6.1 0 8.8L51.3 57c-1.6 2.7-4.6 4.4-7.8 4.4h-23c-3.2 0-6.2-1.7-7.8-4.4L1.2 37.1c-1.6-2.7-1.6-6.1 0-8.8L12.7 8.4C14.3 5.7 17.3 4 20.5 4z"/>
    <path fill="#141414"
          d="M25 19h14c2.1 0 4 1.1 5.1 2.9l7 12.1c1 1.8 1 4 0 5.8l-7 12.1c-1.1 1.8-3 2.9-5.1 2.9H25c-2.1 0-4-1.1-5.1-2.9l-7-12.1c-1-1.8-1-4 0-5.8l7-12.1C21 20.1 22.9 19 25 19z"/>
  </g>
  <rect x="23" y="25" width="21" height="12" rx="3.2" fill="#8ec63f"/>
  <rect x="23" y="25" width="21" height="5" rx="2.4" fill="#a9db60"/>
  <circle cx="29" cy="43" r="4.4" fill="#1c1c1c"/>
  <circle cx="40" cy="43" r="4.4" fill="#1c1c1c"/>
